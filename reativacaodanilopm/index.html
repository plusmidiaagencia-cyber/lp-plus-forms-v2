<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM — Reativação</title>
<style>
  :root{
    --ink:#1D4ED8; --ink2:#3B82F6; --orange:#F97316;
    --bgA:#eaf1ff; --bgB:#f5f8fd;
    --colbg:rgba(255,255,255,.45); --colbd:rgba(255,255,255,.7);
    --card:#ffffff; --cardbd:#eef2f8; --panel:#f7f9fc;
    --txt:#0f1729; --mut:#8a96ad;
  }
  @media(prefers-color-scheme:dark){:root{
    --ink:#93b4ff; --ink2:#60a5fa; --orange:#fb923c;
    --bgA:#0a0d14; --bgB:#0d1119;
    --colbg:rgba(255,255,255,.03); --colbd:rgba(255,255,255,.06);
    --card:#0c1119; --cardbd:rgba(255,255,255,.06); --panel:#0f1420;
    --txt:#eef1f7; --mut:#6b7488;
  }}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--txt);
    background:linear-gradient(135deg,var(--bgA),var(--bgB));background-attachment:fixed;
    font:13px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,"Fira Code","SF Mono",Menlo,monospace}

  header{padding:18px 24px 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#4f46e5,#3b82f6);display:grid;place-items:center;color:#fff;font-size:16px;box-shadow:0 6px 18px rgba(59,130,246,.35)}
  h1{margin:0;font-size:17px;font-weight:900;letter-spacing:-.02em}
  .sub{color:var(--mut);font-size:12px}
  .search{margin-left:auto;position:relative}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
  input[type=search]{background:var(--card);border:1px solid var(--cardbd);color:var(--txt);padding:10px 12px 10px 36px;
    border-radius:12px;font-size:13px;width:250px;outline:none;box-shadow:0 8px 20px rgba(16,23,41,.06)}
  input[type=search]:focus{border-color:var(--ink2)}

  .board{display:flex;gap:16px;padding:16px 24px 40px;overflow-x:auto;align-items:flex-start}
  .col{flex:0 0 320px;background:var(--colbg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--colbd);border-radius:32px;padding:20px;box-shadow:0 20px 50px rgba(16,23,41,.06);
    max-height:calc(100vh-108px);display:flex;flex-direction:column}
  .col.drop{outline:2px solid var(--ink2);outline-offset:-6px;background:rgba(59,130,246,.06)}
  .colhead{display:flex;align-items:center;gap:11px;margin-bottom:20px;padding:0 2px}
  .cdot{width:10px;height:10px;border-radius:50%}
  .ctitle{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:var(--ink)}
  .cnum{background:rgba(59,130,246,.1);color:var(--ink2);font-size:9px;font-weight:900;height:20px;min-width:22px;
    border-radius:999px;display:grid;place-items:center;padding:0 7px}
  .cards{overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:2px 4px 4px;scrollbar-width:thin}

  .card{background:var(--card);border:2px solid var(--cardbd);border-radius:24px;padding:18px;
    box-shadow:0 14px 34px rgba(16,23,41,.08);cursor:pointer;transition:.35s cubic-bezier(.2,.8,.2,1);position:relative}
  .card:hover{border-color:rgba(59,130,246,.5);transform:translateY(-3px) scale(1.02);box-shadow:0 22px 46px rgba(59,130,246,.14)}
  .card.drag{opacity:.4}
  .origin{display:flex;align-items:center;gap:7px;margin-bottom:9px}
  .origin .d{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 8px rgba(16,185,129,.5)}
  .origin span{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.2em;color:color-mix(in srgb,var(--ink) 55%,transparent)}
  .cn{font-weight:900;font-size:14px;letter-spacing:-.01em;text-transform:uppercase;color:var(--ink);line-height:1.2}
  .co{display:flex;align-items:center;gap:6px;margin-top:7px}
  .co svg{color:color-mix(in srgb,var(--ink2) 35%,transparent);flex-shrink:0}
  .co span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:color-mix(in srgb,var(--ink) 60%,transparent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
  .av{width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;font-size:9px;font-weight:900;
    display:grid;place-items:center;border:2px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .val{font-size:12px;font-weight:900;color:var(--ink)}
  .motivo{display:inline-flex;align-items:center;gap:5px;margin-top:11px;font-size:10px;font-weight:800;
    text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;border-radius:999px;
    background:rgba(148,163,184,.14);color:var(--mut)}
  .motivo .md{width:6px;height:6px;border-radius:50%;background:currentColor}
  .empty{color:var(--mut);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;text-align:center;padding:24px 0;opacity:.5}

  /* ===== MODAL (abrir card = painel do negócio, igual GPM) ===== */
  .ov{position:fixed;inset:0;background:rgba:0;background:rgba(9,12,20,.55);backdrop-filter:blur(4px);z-index:100;
    display:none;align-items:flex-start;justify-content:center;padding:28px;overflow-y:auto}
  .ov.on{display:flex}
  .dlg{background:var(--bgB);width:100%;max-width:1180px;border-radius:24px;box-shadow:0 40px 100px rgba(0,0,0,.4);overflow:hidden}
  .dlgtop{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--cardbd);background:var(--card)}
  .dlgtop b{font-size:15px;font-weight:900}
  .x{width:34px;height:34px;border-radius:10px;border:1px solid var(--cardbd);background:var(--card);color:var(--mut);
    font-size:18px;cursor:pointer;display:grid;place-items:center}
  .x:hover{color:var(--txt)}
  .steps{display:flex;gap:6px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--cardbd);background:var(--card)}
  .step{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);
    padding:6px 12px;border-radius:999px;border:1px solid var(--cardbd);cursor:pointer;display:flex;align-items:center;gap:6px}
  .step .sd{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5}
  .step.on{color:#fff;border-color:transparent}
  .step:hover{border-color:var(--ink2)}

  .grid{display:grid;grid-template-columns:300px 1fr 300px;gap:16px;padding:20px 24px 28px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .box{background:var(--card);border:1px solid var(--cardbd);border-radius:18px;padding:16px}
  .box+.box{margin-top:14px}
  .box .h{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);display:flex;align-items:center;gap:7px;margin-bottom:12px}
  .leadhero{text-align:center}
  .leadhero .ic{width:56px;height:56px;border-radius:16px;background:rgba(59,130,246,.1);display:grid;place-items:center;margin:2px auto 10px;font-size:24px}
  .leadhero .nm{font-size:19px;font-weight:900;color:var(--ink);letter-spacing:-.01em}
  .sc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .sc .k{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
  .sc .v{font-size:12px;font-weight:700;margin-top:2px}
  .field{margin-bottom:11px}
  .field:last-child{margin-bottom:0}
  .field .k{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
  .field .v{font-size:13px;margin-top:2px;word-break:break-word}
  .field .v a{color:var(--ink2);text-decoration:none;font-weight:600}
  .field .v a:hover{text-decoration:underline}
  .noteblk{background:var(--panel);border-radius:12px;padding:13px 15px;font-size:13.5px;line-height:1.55}
  .abblk{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.25);border-radius:12px;padding:13px 15px;font-size:13.5px;line-height:1.5;color:#059669}

  .abblk b{color:var(--txt)}
  .waBig{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:14px;
    border-radius:14px;background:#22c55e;color:#fff;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;
    text-decoration:none;box-shadow:0 10px 26px rgba(34,197,94,.35)}
  .waBig:hover{filter:brightness(1.05)}
  .potfat{font-size:22px;font-weight:900;color:var(--ink);font-family:ui-monospace,monospace}
  .mv{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .mvb{padding:11px;border-radius:12px;border:1px solid var(--cardbd);background:var(--card);font-size:12px;font-weight:800;
    text-transform:uppercase;letter-spacing:.05em;cursor:pointer;text-align:left;display:flex;align-items:center;gap:9px;color:var(--txt)}
  .mvb:hover{border-color:var(--ink2)}
  .mvb.cur{background:var(--ink2);color:#fff;border-color:transparent}
  .mvb .md{width:8px;height:8px;border-radius:50%;background:currentColor}
</style>
</head>

function build(){
  document.getElementById('board').innerHTML=COLS.map(c=>`
    <div class="col" data-col="${c.id}">
      <div class="colhead"><span class="cdot" style="background:${c.c};box-shadow:0 0 10px ${c.c}66"></span>
        <span class="ctitle">${c.t}</span><span class="cnum" id="n_${c.id}">0</span></div>
      <div class="cards" id="cards_${c.id}"></div>
    </div>`).join('');
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drop')});
    col.addEventListener('dragleave',()=>col.classList.remove('drop'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('drop');
      const id=e.dataTransfer.getData('id'); if(id){STATUS[id]=col.dataset.col;save();render()}});
  });
  document.getElementById('ov').addEventListener('click',closeDlg);
}
function card(x){
  return `<div class="card" draggable="true" data-id="${x.id}" onclick="openDlg('${x.id}')">
    ${x.segmento?`<div class="origin"><span class="d"></span><span>${esc(x.segmento)}</span></div>`:''}
    <div class="cn">${esc(x.nome)}</div>
    ${x.empresa?`<div class="co"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/></svg><span>${esc(x.empresa)}</span></div>`:''}
    <div class="foot"><div class="av">${ini(x.nome)}</div>${x.fat?`<div class="val mono">${esc(x.fat)}</div>`:''}</div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px">
      ${x.motivo?`<div class="motivo" style="margin-top:0"><span class="md"></span>${esc(x.motivo)}</div>`:''}
      ${x.perdido?`<span style="font-size:10px;font-weight:700;color:var(--mut)">📅 ${esc(x.perdido)}</span>`:''}
    </div>
  </div>`;
}
function render(){
  const ql=q.toLowerCase().trim();
  const shown=DATA.filter(x=>!ql||[x.nome,x.empresa,x.segmento,x.insta,x.obs].join(' ').toLowerCase().includes(ql));
  COLS.forEach(c=>{
    const rows=shown.filter(x=>stOf(x.id)===c.id);
    document.getElementById('n_'+c.id).textContent=rows.length;
    document.getElementById('cards_'+c.id).innerHTML=rows.map(card).join('')||'<div class="empty">Vazio</div>';
  });
  document.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('dragstart',e=>{e.dataTransfer.setData('id',el.dataset.id);el.classList.add('drag')});
    el.addEventListener('dragend',()=>el.classList.remove('drag'));
  });
}

        </div>
        <div class="noteblk">${esc(x.obs)||'<span style="color:var(--mut)">Sem observações registradas.</span>'}</div>
        ${x.call?`<div class="field" style="margin-top:12px"><div class="k">📅 Última call agendada</div><div class="v">${esc(x.call)}</div></div>`:''}
      </div>
      <a class="waBig" href="https://wa.me/${x.fone}" target="_blank">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 .9-2.2.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2.1.4 0 .5l-.4.5c-.2.2-.3.4-.1.7.2.3.9 1.4 1.9 2.3 1.3 1.1 2.3 1.5 2.6 1.6.3.1.5.1.7-.1l.7-.8c.2-.3.4-.2.7-.1l1.9.9c.3.1.4.2.5.3.1.2.1.7-.1 1.2Z"/></svg>
        Abrir conversa no WhatsApp
      </a>
    </div>
    <div>
      <div class="box">
        <div class="h">💰 Potencial</div>
        <div class="potfat">${esc(x.fat)||'—'}</div>
        <div class="field" style="margin-top:6px"><div class="k">Faturamento declarado /mês</div></div>
      </div>
      <div class="box">
        <div class="h">🔀 Mover etapa</div>
        <div class="mv">${COLS.map(c=>{const on=stOf(id)===c.id;return `<button class="mvb ${on?'cur':''}" onclick="moveTo('${c.id}')"><span class="md" style="${on?'':`color:${c.c}`}"></span>${c.t}</button>`}).join('')}</div>
      </div>
    </div>`;
  document.getElementById('ov').classList.add('on');
}
function moveTo(col){ if(openId){STATUS[openId]=col;save();render();openDlg(openId);} }
function closeDlg(){document.getElementById('ov').classList.remove('on');openId=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDlg()});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render()});
build();render();
</script>
</body>
</html>
