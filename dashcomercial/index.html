  :root{

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);

  .mono{font-variant-numeric:tabular-nums}
  .app{display:flex;min-height:100vh}
  .side{flex:0 0 210px;background:var(--side);border-right:1px solid var(--line);padding:14px 12px}
  .side .it{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:12px;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer}
  .side .it.on{background:linear-gradient(90deg,#123661,#0f2140);color:#eaf2ff;border:1px solid #24467e;box-shadow:0 6px 18px #0006}
  .side .it svg{opacity:.9}
  @media(max-width:820px){.side{display:none}}
  .main{flex:1;padding:14px 16px 40px;min-width:0}
  .hd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 22px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:9px}
  .logo .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#2b7de0,#5aa8ff);display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px}
  .logo .txt{line-height:1}
  .logo .txt b{font-size:15px;font-weight:900;letter-spacing:.12em}
  .logo .txt span{font-size:11px;letter-spacing:.34em;color:var(--ink2);display:block;margin-top:2px}
  .htitle{color:var(--ink2);font-size:13px;margin-top:10px}
  .htitle b{color:var(--ink)}
  .hleft{border-bottom:1px solid var(--line2);padding-bottom:10px}
  .btnmore{background:#c9cdd4;color:#2a3550;border:none;border-radius:7px;padding:12px 26px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer}
  .range{margin-left:auto;background:#0f1f3a;border:1px solid var(--line2);color:#eef3fb;border-radius:9px;padding:12px 18px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
  .range:hover{border-color:#3d6bb0;background:#12244a}
  /* seletor de período */
  .dp{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:12px;box-shadow:0 20px 50px #000b;min-width:240px}
  .dp-presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .dp-presets button{background:#0f1f3a;border:1px solid var(--line2);color:var(--ink2);border-radius:8px;padding:9px 8px;font-size:12.5px;font-weight:700;cursor:pointer;text-align:left}
  .dp-presets button:hover{background:#173257;color:#eaf2ff;border-color:#3d6bb0}
  .dp-custom{display:flex;flex-direction:column;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .dp-custom label{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .dp-custom input[type=date]{background:#0f1f3a;border:1px solid var(--line2);color:#eef3fb;border-radius:7px;padding:6px 8px;font-size:12.5px;color-scheme:dark}
  .dp-apply{background:linear-gradient(90deg,#2b7de0,#3d8bd6);border:none;color:#fff;border-radius:8px;padding:9px;font-size:13px;font-weight:800;cursor:pointer;margin-top:3px}
  .dp-apply:hover{filter:brightness(1.08)}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:14px}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-height:118px;display:flex;flex-direction:column}
  .kpi .l{font-size:13px;color:var(--ink2);font-weight:600}
  .kpi .v{font-size:30px;font-weight:800;letter-spacing:-.01em;margin-top:6px;line-height:1}
  .kpi .dd{font-size:12px;font-weight:800;color:var(--green);margin-top:4px}
  .kpi .dd.down{color:var(--red)}
  .kpi .spark{margin-top:auto;height:34px}
  .grid{display:grid;grid-template-columns:420px 1fr;gap:14px;margin-top:14px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
  .card h2{margin:0 0 20px;font-size:20px;font-weight:600;color:#eef3fb}
  .funnel{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:6px}
  .fseg{position:relative;color:#fff;text-align:center;padding:14px 0 16px;filter:drop-shadow(0 8px 14px #0007)}
  .fseg .fl{font-size:12px;font-weight:600;opacity:.92}
  .fseg .fv{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .lg{display:flex;gap:22px;align-items:center;margin-bottom:6px;padding-left:6px}
  .lg .li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
  .lg .ln{width:20px;height:3px;border-radius:2px}
  svg{display:block;width:100%;overflow:visible}
  .axl{fill:#5f7196;font-size:10px}
  .grln{stroke:#16233c;stroke-width:1}
  .tt{position:fixed;pointer-events:none;background:#07101f;border:1px solid var(--line2);border-radius:9px;padding:8px 11px;font-size:12px;color:#eef3fb;box-shadow:0 12px 30px #000a;opacity:0;transition:opacity .1s;z-index:60;white-space:nowrap}
  .tt b{color:#fff}
  .foot{color:#5f7196;font-size:11px;text-align:center;margin-top:24px}

const tt=document.getElementById('tt');
const showTT=(h,x,y)=>{tt.innerHTML=h;tt.style.opacity=1;tt.style.left=(x+14)+'px';tt.style.top=(y-8)+'px';};
const hideTT=()=>tt.style.opacity=0;
const N=n=>Math.round(n).toLocaleString('pt-BR');
const N1=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const MMDD=d=>String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const MES=['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
const sum=(arr,i)=>arr.reduce((a,r)=>a+r[i],0);
function labelDay(mmdd){const m=+mmdd.slice(0,2),d=+mmdd.slice(2);return d+' de '+MES[m-1];}
function idxByISO(iso){return DATA.findIndex(r=>r[0]===iso.slice(5).replace('-',''));}
function isoOf(idx){return '2026-'+DATA[idx][0].slice(0,2)+'-'+DATA[idx][0].slice(2);}

/* ---- base = ONTEM (relatório de Meta Ads fecha o dia anterior) ---- */
function baseEndIndex(){
  const now=new Date(); now.setDate(now.getDate()-1);
  let idx=DATA.findIndex(r=>r[0]===MMDD(now));
  if(idx<0) idx=DATA.length-1;   // fora de 2026 → último dia disponível
  return idx;
}

/* ===== spark (mini-linha do KPI) ===== */
function spark(vals,color){
  const W=180,H=34,mx=Math.max(...vals),mn=Math.min(...vals),pad=(mx-mn)*0.2||1;
  const X=i=>i/(vals.length-1)*W, Y=v=>H-2-((v-mn+pad)/((mx-mn)+2*pad))*(H-4);
  let p='';vals.forEach((v,i)=>p+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:34px">
    <path d="${p}L${W} ${H} L0 ${H} Z" fill="${color}22"/>
    <path d="${p}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
}

/* ===== RENDER — recalcula tudo para a janela [startI..endI] ===== */
function render(startI,endI){
  startI=Math.max(0,Math.min(startI,DATA.length-1));
  endI=Math.max(startI,Math.min(endI,DATA.length-1));
  const win=DATA.slice(startI,endI+1);
  const len=win.length;
  const prev=DATA.slice(Math.max(0,startI-len),startI);

  const invest=sum(win,8), faturamento=sum(win,5), vendas=sum(win,9);
  const alcance=sum(win,1), impressoes=sum(win,6), clicks=sum(win,2);
  const cpa=vendas?invest/vendas:0, roas=invest?faturamento/invest:0;
  const vendasPrev=sum(prev,9)||vendas||1;
  const deltaVendas=(vendas-vendasPrev)/vendasPrev*100;

  /* rótulo do período */
  document.getElementById('range').innerHTML=
    labelDay(win[0][0])+' de 2026 &ndash; '+labelDay(win[len-1][0])+' de 2026 <span style="opacity:.6">&#9662;</span>';

  /* KPIs */
  const investSerie=win.map(r=>r[8]);
  const up=deltaVendas>=0;
  const kpis=[
    {l:'Valor Investido', v:'R$ '+N(invest), spark:spark(investSerie,'#4ea86a')},
    {l:'CPA', v:'R$ '+N1(cpa), spark:spark(win.map(r=>r[3]),'#3d8bd6')},
    {l:'Faturamento', v:'R$ '+N(faturamento), spark:spark(win.map(r=>r[5]),'#c9702e')},
    {l:'Vendas', v:N(vendas), d:(up?'&#9650; ':'&#9660; ')+N1(Math.abs(deltaVendas))+'%', down:!up, spark:spark(win.map(r=>r[9]),'#57c07a')},
    {l:'ROAS', v:N1(roas), spark:spark(win.map(r=>r[8]?r[5]/r[8]:0),'#3d8bd6')},
  ];
  document.getElementById('kpis').innerHTML=kpis.map(k=>`
    <div class="kpi"><div class="l">${k.l}</div><div class="v mono">${k.v}</div>
    ${k.d?`<div class="dd ${k.down?'down':''}">${k.d}</div>`:''}<div class="spark">${k.spark}</div></div>`).join('');

  /* Funil (larguras visuais fixas; valores reais) */
  const fn=[{l:'Alcance',v:alcance},{l:'Impress&otilde;es',v:impressoes},{l:'Clicks',v:clicks},{l:'Vendas',v:vendas}];
  const FW=[100,80,58,38];
  document.getElementById('funnel').innerHTML=fn.map((s,i)=>{
    const wTop=FW[i], wBot=(fn[i+1]?FW[i+1]:22);
    const inTop=(100-wTop)/2, inBot=(100-wBot)/2;
    const clip=`polygon(${inTop}% 0, ${100-inTop}% 0, ${100-inBot}% 100%, ${inBot}% 100%)`;
    return `<div class="fseg" style="width:340px;-webkit-clip-path:${clip};clip-path:${clip};
       background:linear-gradient(180deg,#4aa0ff,#1f6fe0)">
       <div class="fl">${s.l}</div><div class="fv mono">${N(s.v)}</div></div>`;
  }).join('') + `<div style="width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:34px solid #1f6fe0;filter:drop-shadow(0 8px 12px #0007)"></div>`;

  /* Gráfico de linhas */
  const days=win.map(r=>r[0].slice(2)+'/'+r[0].slice(0,2));
  const invd=investSerie, cpm=win.map(r=>r[4]), cpc=win.map(r=>r[2]?+(r[8]/r[2]).toFixed(2):0);
  const el=document.getElementById('chart');
  const W=780,H=430,pl=42,pr=14,pt=16,pb=34, iw=W-pl-pr, ih=H-pt-pb;
  const max=Math.ceil(Math.max(...invd,1)/100)*100+100;
  const X=i=>pl+iw*(len>1?i/(len-1):0.5), Y=v=>pt+ih*(1-v/max);
  const smooth=(p)=>{if(p.length<2)return p.length?`M${p[0][0]} ${p[0][1]}`:'';let d='M'+p[0][0]+' '+p[0][1];for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;}return d;};
  const pts=a=>a.map((v,i)=>[X(i),Y(v)]);
  let grid='',yl='';for(let g=0;g<=6;g++){const y=pt+ih*g/6,val=Math.round(max*(1-g/6));grid+=`<line class="grln" x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}"/>`;yl+=`<text class="axl" x="${pl-8}" y="${y+3}" text-anchor="end">${val}</text>`;}
  const step=Math.max(1,Math.ceil(len/9));
  let xl='';days.forEach((d,i)=>{if(i%step===0||(i===len-1&&(len-1)%step>1))xl+=`<text class="axl" x="${X(i)}" y="${H-8}" text-anchor="middle">${d}</text>`;});
  const hw=Math.min(28,iw/len);
  let hot='';days.forEach((d,i)=>{hot+=`<rect x="${X(i)-hw/2}" y="${pt}" width="${hw}" height="${ih}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><g>${grid}</g>${yl}
    <path d="${smooth(pts(invd))}" fill="none" stroke="#4ea86a" stroke-width="2.5"/>
    <path d="${smooth(pts(cpm))}" fill="none" stroke="#3d8bd6" stroke-width="2"/>
    <path d="${smooth(pts(cpc))}" fill="none" stroke="#d15b6a" stroke-width="2"/>
    <line id="cx" x1="0" x2="0" y1="${pt}" y2="${pt+ih}" stroke="#3d8bd6" stroke-width="1" opacity="0"/>
    ${xl}${hot}</svg>`;
  const cx=el.querySelector('#cx');
  el.querySelectorAll('rect[data-i]').forEach(r=>{
    r.addEventListener('mousemove',e=>{const i=+r.dataset.i;cx.setAttribute('x1',X(i));cx.setAttribute('x2',X(i));cx.setAttribute('opacity','.5');
      showTT(`<b>${days[i]}</b><br>Valor Investido: R$ ${N(invd[i])}<br>CPM: R$ ${N1(cpm[i])}<br>CPC: R$ ${N1(cpc[i])}`,e.clientX,e.clientY);});
    r.addEventListener('mouseleave',()=>{cx.setAttribute('opacity','0');hideTT();});
  });
}

  pop.style.left=(r.right-pop.offsetWidth)+'px';
  document.getElementById('dpFrom').value=isoOf(curStart);
  document.getElementById('dpTo').value=isoOf(curEnd);
}
const closePop=()=>pop.hidden=true;
document.getElementById('range').addEventListener('click',e=>{e.stopPropagation();pop.hidden?openPop():closePop();});
document.addEventListener('click',e=>{if(!pop.contains(e.target))closePop();});

pop.querySelectorAll('.dp-presets button').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.n){curEnd=base;curStart=Math.max(0,base-(+b.dataset.n-1));}
  else if(b.dataset.p==='mes'){const m=DATA[base][0].slice(0,2);curStart=DATA.findIndex(r=>r[0].slice(0,2)===m);curEnd=base;}
  else if(b.dataset.p==='mespass'){
    const m=+DATA[base][0].slice(0,2), pm=String(m-1||12).padStart(2,'0');
    curStart=DATA.findIndex(r=>r[0].slice(0,2)===pm);
    let e2=curStart;while(e2<DATA.length-1&&DATA[e2+1][0].slice(0,2)===pm)e2++;curEnd=e2;
  }
  render(curStart,curEnd);closePop();
}));
document.getElementById('dpApply').addEventListener('click',()=>{
  const f=idxByISO(document.getElementById('dpFrom').value), t=idxByISO(document.getElementById('dpTo').value);
  if(f>=0&&t>=0){curStart=Math.min(f,t);curEnd=Math.max(f,t);render(curStart,curEnd);}
  closePop();
});

render(curStart,curEnd);
</script>
</body></html>
