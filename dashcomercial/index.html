<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Plus Mídia — Meta Ads</title></head><body>
<style>
  :root{
    --bg:#0b1120; --side:#0c1424; --panel:#0f1a2e; --panel2:#0e1728;
    --line:#1a2740; --line2:#24365a;
    --ink:#eef3fb; --ink2:#a7b6d2; --mut:#6478a0;
    --green:#4ea86a; --greenL:#57c07a; --blue:#3d8bd6; --red:#d15b6a; --orange:#c9702e;
    --funA:#1f6fe0; --funB:#4aa0ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-variant-numeric:tabular-nums}
  .app{display:flex;min-height:100vh}
  .side{flex:0 0 210px;background:var(--side);border-right:1px solid var(--line);padding:14px 12px}
  .side .it{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:12px;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer}
  .side .it.on{background:linear-gradient(90deg,#123661,#0f2140);color:#eaf2ff;border:1px solid #24467e;box-shadow:0 6px 18px #0006}
  .side .it svg{opacity:.9}
  @media(max-width:820px){.side{display:none}}
  .main{flex:1;padding:14px 16px 40px;min-width:0}
  .hd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 22px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:9px}
  .logo .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#2b7de0,#5aa8ff);display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px}
  .logo .txt{line-height:1}
  .logo .txt b{font-size:15px;font-weight:900;letter-spacing:.12em}
  .logo .txt span{font-size:11px;letter-spacing:.34em;color:var(--ink2);display:block;margin-top:2px}
  .htitle{color:var(--ink2);font-size:13px;margin-top:10px}
  .htitle b{color:var(--ink)}
  .hleft{border-bottom:1px solid var(--line2);padding-bottom:10px}
  .btnmore{background:#c9cdd4;color:#2a3550;border:none;border-radius:7px;padding:12px 26px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer}
  /* seletor de segmento */
  .seg{margin-left:26px;background:#0f1f3a;border:1px solid var(--line2);border-radius:9px;padding:9px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .seg:hover{border-color:#3d6bb0;background:#12244a}
  .seg-lb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
  .seg-v{font-size:14px;font-weight:800;color:#eaf2ff}
  .segpop{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px;box-shadow:0 20px 50px #000b;min-width:180px}
  .segpop button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink2);border-radius:8px;padding:10px 12px;font-size:13.5px;font-weight:700;cursor:pointer}
  .segpop button:hover{background:#173257;color:#eaf2ff}
  .segpop button.on{background:linear-gradient(90deg,#123661,#0f2140);color:#eaf2ff}
  .range{margin-left:auto;background:#0f1f3a;border:1px solid var(--line2);color:#eef3fb;border-radius:9px;padding:12px 18px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
  .range:hover{border-color:#3d6bb0;background:#12244a}
  /* seletor de período */
  .dp{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:14px;box-shadow:0 24px 60px #000c;width:288px}
  .dp-months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .dp-months button{background:#0f1f3a;border:1px solid var(--line2);color:var(--ink2);border-radius:8px;padding:9px 4px;font-size:12px;font-weight:700;cursor:pointer;text-align:center}
  .dp-months button:hover{background:#173257;color:#eaf2ff;border-color:#3d6bb0}
  .dp-months button.on{background:linear-gradient(135deg,#2b7de0,#3d8bd6);color:#fff;border-color:#5aa8ff}
  .dp-cal{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .dp-calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .dp-calhd span{font-size:13.5px;font-weight:800;color:#eaf2ff}
  .dp-nav{background:#0f1f3a;border:1px solid var(--line2);color:#cfe0ff;width:30px;height:30px;border-radius:8px;font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center}
  .dp-nav:hover{background:#173257;border-color:#3d6bb0}
  .dp-nav:disabled{opacity:.3;cursor:default}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .dp-wd{text-align:center;font-size:10.5px;font-weight:800;color:var(--mut);padding:2px 0 4px}
  .dp-day{text-align:center;font-size:12.5px;font-weight:600;color:var(--ink2);height:31px;display:grid;place-items:center;border-radius:8px;cursor:pointer;user-select:none}
  .dp-day:hover:not(.off){background:#17305a}
  .dp-day.off{color:transparent;cursor:default;pointer-events:none}
  .dp-day.inrange{background:#14284a;color:#dcebff}
  .dp-day.sel{background:linear-gradient(135deg,#2b7de0,#3d8bd6);color:#fff;font-weight:800}
  .dp-foot{display:flex;align-items:center;gap:10px;margin-top:11px}
  .dp-selinfo{flex:1;font-size:11px;color:var(--ink2);line-height:1.25}
  .dp-apply{background:linear-gradient(90deg,#2b7de0,#3d8bd6);border:none;color:#fff;border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap}
  .dp-apply:hover{filter:brightness(1.08)}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:14px}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-height:118px;display:flex;flex-direction:column}
  .kpi .l{font-size:13px;color:var(--ink2);font-weight:600}
  .kpi .v{font-size:30px;font-weight:800;letter-spacing:-.01em;margin-top:6px;line-height:1}
  .kpi .dd{font-size:12px;font-weight:800;color:var(--green);margin-top:4px}
  .kpi .dd.down{color:var(--red)}
  .kpi .spark{margin-top:auto;height:34px}
  .grid{display:grid;grid-template-columns:420px 1fr;gap:14px;margin-top:14px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
  .card h2{margin:0 0 20px;font-size:20px;font-weight:600;color:#eef3fb}
  .funnel{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:6px}
  .fseg{position:relative;color:#fff;text-align:center;padding:14px 0 16px;filter:drop-shadow(0 8px 14px #0007)}
  .fseg .fl{font-size:12px;font-weight:600;opacity:.92}
  .fseg .fv{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .lg{display:flex;gap:22px;align-items:center;margin-bottom:6px;padding-left:6px}
  .lg .li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
  .lg .ln{width:20px;height:3px;border-radius:2px}
  svg{display:block;width:100%;overflow:visible}
  .axl{fill:#5f7196;font-size:10px}
  .grln{stroke:#16233c;stroke-width:1}
  .tt{position:fixed;pointer-events:none;background:#07101f;border:1px solid var(--line2);border-radius:9px;padding:8px 11px;font-size:12px;color:#eef3fb;box-shadow:0 12px 30px #000a;opacity:0;transition:opacity .1s;z-index:60;white-space:nowrap}
  .tt b{color:#fff}
  .foot{color:#5f7196;font-size:11px;text-align:center;margin-top:24px}
</style>

<div class="app">
  <main class="main">
    <div class="hd">
      <div class="logo">
        <div class="mk">&#9650;</div>
        <div class="txt"><b>PLUS</b><span>M&Iacute;DIA</span></div>
      </div>
      <div class="seg" id="seg">
        <span class="seg-lb">Segmento</span>
        <span class="seg-v" id="segV">Moda Fitness</span>
        <span style="opacity:.55">&#9662;</span>
      </div>
      <div class="range" id="range">&mdash; <span style="opacity:.6">&#9662;</span></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <div class="card">
        <h2>Funil de Tr&aacute;fego</h2>
        <div class="funnel" id="funnel"></div>
      </div>
      <div class="card">
        <div class="lg">
          <div class="li"><span class="ln" style="background:var(--green)"></span> Faturamento</div>
          <div class="li"><span class="ln" style="background:var(--blue)"></span> Valor Investido</div>
        </div>
        <div id="chart"></div>
      </div>
    </div>
    <div class="foot">Painel de demonstra&ccedil;&atilde;o &middot; Plus M&iacute;dia &mdash; visual ilustrativo para apresenta&ccedil;&atilde;o comercial.</div>
  </main>
</div>
<div class="tt" id="tt"></div>

<script>
/* ============================================================
   PAINEL PLUS MÍDIA — dados fake gerados na hora (perpétuo)
   Cada dia é calculado de forma DETERMINÍSTICA a partir da data,
   com sazonalidade de e-commerce real e ROAS variável por mês.
   Funciona pra qualquer data (passado e futuro) — nunca "acaba".
   ============================================================ */

const tt=document.getElementById('tt');
const showTT=(h,x,y)=>{tt.innerHTML=h;tt.style.opacity=1;tt.style.left=(x+14)+'px';tt.style.top=(y-8)+'px';};
const hideTT=()=>tt.style.opacity=0;
const N=n=>Math.round(n).toLocaleString('pt-BR');
const N1=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const MES=['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
const MES3=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESLONG=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const WDL=['D','S','T','Q','Q','S','S'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------- gerador determinístico ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* sazonalidade mensal de um e-commerce BR (multiplicador de volume) */
const SEAS =[0.82,0.78,0.96,1.00,1.18,1.06,0.94,0.90,1.00,1.08,1.38,1.28]; // jan..dez
/* ROAS alvo por mês (varia: fraco no começo do ano, forte no 2º semestre/BF) */
const ROASM=[6.5, 6.8, 7.2, 7.5, 8.4, 8.0, 7.3, 7.0, 7.6, 8.1, 9.0, 8.3];
/* peso por dia da semana (dom..sáb) — loja vende mais em dia útil */
const WDF  =[0.86,1.03,1.06,1.04,1.05,1.00,0.90];

function genDay(date){
  const y=date.getFullYear(), m=date.getMonth(), d=date.getDate(), dow=date.getDay();
  const r=mulberry32(y*10000+(m+1)*100+d);
  const growth=1+(y-2026)*0.09;                     // loja cresce ~9%/ano
  const invBase=385*SEAS[m]*growth*WDF[dow];
  const invest=Math.round(invBase*(0.90+r()*0.20)); // ±10% ruído diário
  const roas=+(ROASM[m]*(0.93+r()*0.14)).toFixed(2);// alvo do mês ±7%
  const faturamento=Math.round(invest*roas);
  const ticket=235+Math.round(r()*50);              // ticket médio R$235–285
  const vendas=Math.max(1,Math.round(faturamento/ticket));
  const cpm=Math.round(22+r()*15);                  // CPM R$22–37
  const impressoes=Math.round(invest/cpm*1000);
  const clicks=Math.round(impressoes*(0.018+r()*0.022)); // CTR 1,8–4%
  const alcance=Math.round(impressoes*(0.55+r()*0.30));
  const mensagens=Math.round(6+r()*40);
  const cpa=Math.round(invest/vendas);
  return {date:new Date(y,m,d),invest,faturamento,vendas,roas,ticket,cpm,impressoes,clicks,alcance,mensagens,cpa};
}

/* ---------- helpers de data ---------- */
const DAY=86400000;
const addDays=(dt,n)=>{const x=new Date(dt);x.setDate(x.getDate()+n);return x;};
const iso=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
function daysBetween(a,b){const out=[];let x=new Date(a);while(x<=b){out.push(new Date(x));x=addDays(x,1);}return out;}
function labelDay(dt){return dt.getDate()+' de '+MES[dt.getMonth()];}

/* "ontem" real (relatório de Meta Ads fecha o dia anterior) */
const MIN=new Date(2026,0,1);
function yesterday(){const t=new Date();t.setHours(0,0,0,0);let y=addDays(t,-1);if(y<MIN)y=new Date(MIN);return y;}
const BASE=yesterday();

/* ---------- spark ---------- */
function spark(vals,color){
  const W=180,H=34,mx=Math.max(...vals),mn=Math.min(...vals),pad=(mx-mn)*0.2||1;
  const X=i=>i/(vals.length-1)*W, Y=v=>H-2-((v-mn+pad)/((mx-mn)+2*pad))*(H-4);
  let p='';vals.forEach((v,i)=>p+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:34px">
    <path d="${p}L${W} ${H} L0 ${H} Z" fill="${color}22"/>
    <path d="${p}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
}

/* ---------- RENDER ---------- */
let curStart, curEnd;   // Date
function render(startDate,endDate){
  if(startDate>endDate){const t=startDate;startDate=endDate;endDate=t;}
  if(startDate<MIN)startDate=new Date(MIN);
  if(endDate>BASE)endDate=new Date(BASE);
  curStart=startDate; curEnd=endDate;
  const win=daysBetween(startDate,endDate).map(genDay);
  const len=win.length;
  const prevEnd=addDays(startDate,-1), prevStart=addDays(startDate,-len);
  const prev=daysBetween(prevStart,prevEnd).map(genDay);

  const S=(a,k)=>a.reduce((x,r)=>x+r[k],0);
  const invest=S(win,'invest'), faturamento=S(win,'faturamento'), vendas=S(win,'vendas');
  const alcance=S(win,'alcance'), impressoes=S(win,'impressoes'), clicks=S(win,'clicks');
  const cpa=vendas?invest/vendas:0, roas=invest?faturamento/invest:0;
  const vendasPrev=S(prev,'vendas')||vendas||1;
  const deltaVendas=(vendas-vendasPrev)/vendasPrev*100;

  document.getElementById('range').innerHTML=
    labelDay(win[0].date)+' de '+win[0].date.getFullYear()+' &ndash; '+labelDay(win[len-1].date)+' de '+win[len-1].date.getFullYear()+' <span style="opacity:.6">&#9662;</span>';

  const up=deltaVendas>=0;
  const kpis=[
    {l:'Valor Investido', v:'R$ '+N(invest), spark:spark(win.map(r=>r.invest),'#4ea86a')},
    {l:'CPA', v:'R$ '+N1(cpa), spark:spark(win.map(r=>r.cpa),'#3d8bd6')},
    {l:'Faturamento', v:'R$ '+N(faturamento), spark:spark(win.map(r=>r.faturamento),'#c9702e')},
    {l:'Vendas', v:N(vendas), d:(up?'&#9650; ':'&#9660; ')+N1(Math.abs(deltaVendas))+'%', down:!up, spark:spark(win.map(r=>r.vendas),'#57c07a')},
    {l:'ROAS', v:N1(roas), spark:spark(win.map(r=>r.roas),'#3d8bd6')},
  ];
  document.getElementById('kpis').innerHTML=kpis.map(k=>`
    <div class="kpi"><div class="l">${k.l}</div><div class="v mono">${k.v}</div>
    ${k.d?`<div class="dd ${k.down?'down':''}">${k.d}</div>`:''}<div class="spark">${k.spark}</div></div>`).join('');

  /* funil */
  const fn=[{l:'Alcance',v:alcance},{l:'Impress&otilde;es',v:impressoes},{l:'Clicks',v:clicks},{l:'Vendas',v:vendas}];
  const FW=[100,80,58,38];
  document.getElementById('funnel').innerHTML=fn.map((s,i)=>{
    const wTop=FW[i], wBot=(fn[i+1]?FW[i+1]:22);
    const inTop=(100-wTop)/2, inBot=(100-wBot)/2;
    const clip=`polygon(${inTop}% 0, ${100-inTop}% 0, ${100-inBot}% 100%, ${inBot}% 100%)`;
    return `<div class="fseg" style="width:340px;-webkit-clip-path:${clip};clip-path:${clip};
       background:linear-gradient(180deg,#4aa0ff,#1f6fe0)">
       <div class="fl">${s.l}</div><div class="fv mono">${N(s.v)}</div></div>`;
  }).join('') + `<div style="width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:34px solid #1f6fe0;filter:drop-shadow(0 8px 12px #0007)"></div>`;

  /* gráfico — Faturamento x Valor Investido (mesmo eixo, R$) */
  const days=win.map(r=>String(r.date.getDate()).padStart(2,'0')+'/'+String(r.date.getMonth()+1).padStart(2,'0'));
  const fatd=win.map(r=>r.faturamento), invd=win.map(r=>r.invest), vend=win.map(r=>r.vendas), roasd=win.map(r=>r.roas);
  const el=document.getElementById('chart');
  const W=780,H=430,pl=48,pr=14,pt=16,pb=34, iw=W-pl-pr, ih=H-pt-pb;
  const max=Math.ceil(Math.max(...fatd,1)/500)*500+500;
  const X=i=>pl+iw*(len>1?i/(len-1):0.5), Y=v=>pt+ih*(1-v/max);
  const smooth=(p)=>{if(p.length<2)return p.length?`M${p[0][0]} ${p[0][1]}`:'';let d='M'+p[0][0]+' '+p[0][1];for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;}return d;};
  const pts=a=>a.map((v,i)=>[X(i),Y(v)]);
  const fmtK=v=>v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':''+v;
  let grid='',yl='';for(let g=0;g<=6;g++){const yy=pt+ih*g/6,val=Math.round(max*(1-g/6));grid+=`<line class="grln" x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}"/>`;yl+=`<text class="axl" x="${pl-8}" y="${yy+3}" text-anchor="end">${fmtK(val)}</text>`;}
  const step=Math.max(1,Math.ceil(len/9));
  let xl='';days.forEach((dd,i)=>{if(i%step===0||(i===len-1&&(len-1)%step>1))xl+=`<text class="axl" x="${X(i)}" y="${H-8}" text-anchor="middle">${dd}</text>`;});
  const hw=Math.min(28,iw/len);
  let hot='';days.forEach((dd,i)=>{hot+=`<rect x="${X(i)-hw/2}" y="${pt}" width="${hw}" height="${ih}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><g>${grid}</g>${yl}
    <path d="${smooth(pts(fatd))}L${X(len-1)} ${pt+ih} L${X(0)} ${pt+ih} Z" fill="#4ea86a14"/>
    <path d="${smooth(pts(fatd))}" fill="none" stroke="#4ea86a" stroke-width="2.6"/>
    <path d="${smooth(pts(invd))}" fill="none" stroke="#3d8bd6" stroke-width="2.2"/>
    <line id="cx" x1="0" x2="0" y1="${pt}" y2="${pt+ih}" stroke="#3d8bd6" stroke-width="1" opacity="0"/>
    ${xl}${hot}</svg>`;
  const cx=el.querySelector('#cx');
  el.querySelectorAll('rect[data-i]').forEach(rr=>{
    rr.addEventListener('mousemove',e=>{const i=+rr.dataset.i;cx.setAttribute('x1',X(i));cx.setAttribute('x2',X(i));cx.setAttribute('opacity','.5');
      showTT(`<b>${days[i]}</b><br>Faturamento: R$ ${N(fatd[i])}<br>Valor Investido: R$ ${N(invd[i])}<br>Vendas: ${vend[i]} &middot; ROAS ${N1(roasd[i])}`,e.clientX,e.clientY);});
    rr.addEventListener('mouseleave',()=>{cx.setAttribute('opacity','0');hideTT();});
  });
  markActiveMonth();
}

/* ============================================================
   SELETOR DE PERÍODO — filtro de MESES + calendário de intervalo
   ============================================================ */
const pop=document.createElement('div'); pop.className='dp'; pop.hidden=true;
pop.innerHTML=`
  <div class="dp-months" id="dpMonths"></div>
  <div class="dp-cal">
    <div class="dp-calhd">
      <button class="dp-nav" id="dpPrev" aria-label="Mês anterior">&#8249;</button>
      <span id="dpTitle"></span>
      <button class="dp-nav" id="dpNext" aria-label="Próximo mês">&#8250;</button>
    </div>
    <div class="dp-grid" id="dpGrid"></div>
    <div class="dp-foot">
      <span id="dpSel" class="dp-selinfo">Escolha o início e o fim</span>
      <button class="dp-apply" id="dpApply">Aplicar</button>
    </div>
  </div>`;
document.body.appendChild(pop);

/* --- botões de mês (jan..mês atual do ano corrente; cria os próximos sozinho) --- */
function buildMonths(){
  const yr=BASE.getFullYear(), lastM=BASE.getMonth();
  let html='';
  for(let m=0;m<=lastM;m++) html+=`<button data-m="${m}" data-y="${yr}">${MES3[m]}</button>`;
  document.getElementById('dpMonths').innerHTML=html;
  document.querySelectorAll('#dpMonths button').forEach(b=>b.addEventListener('click',()=>{
    const m=+b.dataset.m, yr=+b.dataset.y;
    const s=new Date(yr,m,1);
    let e=new Date(yr,m+1,0);          // último dia do mês
    if(e>BASE)e=new Date(BASE);        // mês atual: só até ontem
    render(s,e); closePop();
  }));
}
function markActiveMonth(){
  document.querySelectorAll('#dpMonths button').forEach(b=>{
    const m=+b.dataset.m, yr=+b.dataset.y;
    const s=new Date(yr,m,1); let e=new Date(yr,m+1,0); if(e>BASE)e=new Date(BASE);
    b.classList.toggle('on', sameDay(curStart,s)&&sameDay(curEnd,e));
  });
}

/* --- calendário de intervalo --- */
let selA=null, selB=null, calY=BASE.getFullYear(), calM=BASE.getMonth();
function drawCal(){
  document.getElementById('dpTitle').textContent=cap(MESLONG[calM])+' de '+calY;
  const first=new Date(calY,calM,1).getDay();
  const ndays=new Date(calY,calM+1,0).getDate();
  const lo=selA&&selB?(selA<selB?selA:selB):selA, hi=selA&&selB?(selA<selB?selB:selA):selA;
  let cells=WDL.map(w=>`<div class="dp-wd">${w}</div>`).join('');
  for(let i=0;i<first;i++) cells+=`<div class="dp-day off"></div>`;
  for(let d=1;d<=ndays;d++){
    const dt=new Date(calY,calM,d);
    const disabled=dt<MIN||dt>BASE;
    let cls='dp-day';
    if(disabled) cls+=' off';
    else{
      if(lo&&hi&&dt>=lo&&dt<=hi) cls+=' inrange';
      if((selA&&sameDay(dt,selA))||(selB&&sameDay(dt,selB))) cls+=' sel';
    }
    cells+=`<div class="${cls}" ${disabled?'':`data-d="${d}"`}>${d}</div>`;
  }
  document.getElementById('dpGrid').innerHTML=cells;
  const info=document.getElementById('dpSel');
  if(selA&&selB) info.textContent=labelDay(selA<selB?selA:selB)+' – '+labelDay(selA<selB?selB:selA);
  else if(selA) info.textContent='Início: '+labelDay(selA)+' — escolha o fim';
  else info.textContent='Escolha o início e o fim';
  document.getElementById('dpPrev').disabled = (calY<=MIN.getFullYear()&&calM<=0);
  document.getElementById('dpNext').disabled = (calY>=BASE.getFullYear()&&calM>=BASE.getMonth());
}

function openPop(){
  selA=new Date(curStart); selB=new Date(curEnd);
  calY=curEnd.getFullYear(); calM=curEnd.getMonth();
  pop.hidden=false; drawCal(); markActiveMonth();
  const r=document.getElementById('range').getBoundingClientRect();
  pop.style.top=(r.bottom+8)+'px';
  const left=Math.min(r.right-pop.offsetWidth, window.innerWidth-pop.offsetWidth-8);
  pop.style.left=Math.max(8,left)+'px';
}
const closePop=()=>pop.hidden=true;
document.getElementById('range').addEventListener('click',e=>{e.stopPropagation();pop.hidden?openPop():closePop();});
document.addEventListener('click',e=>{const rg=document.getElementById('range');if(!pop.contains(e.target)&&!rg.contains(e.target))closePop();});

document.getElementById('dpPrev').addEventListener('click',()=>{if(calM>0){calM--;}else{calM=11;calY--;}drawCal();});
document.getElementById('dpNext').addEventListener('click',()=>{if(calM<11){calM++;}else{calM=0;calY++;}drawCal();});

document.getElementById('dpGrid').addEventListener('click',e=>{
  const c=e.target.closest('.dp-day[data-d]'); if(!c)return;
  const dt=new Date(calY,calM,+c.dataset.d);
  if(!selA||selB){selA=dt;selB=null;}
  else if(dt<selA){selB=selA;selA=dt;}
  else selB=dt;
  drawCal();
});
document.getElementById('dpApply').addEventListener('click',()=>{
  if(selA&&selB) render(selA,selB);
  else if(selA) render(selA,selA);
  closePop();
});

/* ============================================================
   SELETOR DE SEGMENTO (só visual — não altera os dados)
   ============================================================ */
const SEGMENTOS=['Moda Fitness','Moda Masculina','Moda Feminina','Moda Infantil','Moda Praia','Moda Íntima'];
const segEl=document.getElementById('seg'), segV=document.getElementById('segV');
const segpop=document.createElement('div'); segpop.className='segpop'; segpop.hidden=true;
document.body.appendChild(segpop);
function drawSeg(){
  segpop.innerHTML=SEGMENTOS.map(s=>`<button data-s="${s}" class="${s===segV.textContent?'on':''}">${s}</button>`).join('');
}
function openSeg(){
  drawSeg(); segpop.hidden=false;
  const r=segEl.getBoundingClientRect();
  segpop.style.top=(r.bottom+8)+'px';
  segpop.style.left=Math.max(8,r.left)+'px';
}
const closeSeg=()=>segpop.hidden=true;
segEl.addEventListener('click',e=>{e.stopPropagation();segpop.hidden?openSeg():closeSeg();});
segpop.addEventListener('click',e=>{const b=e.target.closest('button[data-s]');if(!b)return;segV.textContent=b.dataset.s;closeSeg();});
document.addEventListener('click',e=>{if(!segpop.contains(e.target)&&!segEl.contains(e.target))closeSeg();});

/* ---------- boot ---------- */
buildMonths();
render(addDays(BASE,-13), BASE);   // padrão: últimos 14 dias terminando ontem
</script>
</body></html>
